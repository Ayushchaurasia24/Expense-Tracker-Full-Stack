<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Expense Tracker</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .auth-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--green), #1ab88a);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px var(--green-glow);
    }
    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .card {
      padding: 32px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .card-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .input-icon {
      position: relative;
    }
    .input-icon .icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
    }
    .input-icon input {
      padding-left: 38px !important;
    }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* loading state */
    .btn-loading .btn-text { display: none; }
    .btn-loading .spinner { display: block; }
    .spinner { display: none; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-icon">💸</div>
      <h1>Expense Tracker</h1>
      <p>Smart money management</p>
    </div>

    <div class="card">
      <div class="card-title">Create your account</div>
      <div class="card-sub">Get started — it's free forever.</div>

      <form id="signupForm" autocomplete="off">
        <div class="field">
          <label>Full Name</label>
          <div class="input-icon">
            <span class="icon">👤</span>
            <input type="text" id="name" placeholder="Ayush Chaurasia" required />
          </div>
        </div>

        <div class="field">
          <label>Email Address</label>
          <div class="input-icon">
            <span class="icon">✉️</span>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="input-icon">
            <span class="icon">🔒</span>
            <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn" style="margin-top:8px;">
          <span class="btn-text">Create Account</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="divider">or</div>

      <div class="footer-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="signup.js"></script>
</body>
</html>
