<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="expense.css" />
</head>
<body>

  <div class="container">

    <h3 id="premiumMsg" style="color: green;"></h3>

    <button id="buyPremiumBtn">Buy Premium</button>

    <h3 id="leaderboardTitle" style="display:none;">🏆 Leaderboard</h3>
    <ul id="leaderboard"></ul>

    <button onclick="window.location.href='report.html'">
      View Reports
    </button>

    <h2>Daily Expenses</h2>

    <!-- 🔥 LIMIT SELECT -->
    <label>Expenses per page:</label>
    <select id="limitSelect">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
      <option value="40">40</option>
    </select>

    <!-- 🔹 FORM -->
    <form id="expenseForm">
      <input type="number" id="amount" placeholder="Amount" required />
      <input type="text" id="description" placeholder="Description" required />
      <input type="text" id="note" placeholder="Add note (optional)" />

      <select id="category">
        <option value="Food">Food</option>
        <option value="Petrol">Petrol</option>
        <option value="Salary">Salary</option>
        <option value="Shopping">Shopping</option>
      </select>

      <button type="submit">Add Expense</button>
    </form>

    <!-- 🔹 EXPENSE LIST -->
    <ul id="expenseList"></ul>

    <!-- 🔥 PAGINATION -->
    <div id="pagination" style="margin-top: 10px;">
      <button id="prevBtn">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next</button>
    </div>

    <!-- 🔹 LOGOUT -->
    <button id="logoutBtn">Logout</button>

  </div>

  <script src="expense.js"></script>

</body>
</html>
