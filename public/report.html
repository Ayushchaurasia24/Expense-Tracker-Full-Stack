<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Expense Tracker</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { padding: 24px 16px; }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .logo-sm {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--green), #1ab88a);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 14px var(--green-glow);
    }
    .app-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }

    /* ── FILTER & DOWNLOAD BAR ── */
    .control-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    .filter-group { display: flex; align-items: center; gap: 10px; }
    .filter-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text-muted);
      transition: all 0.18s;
    }
    .pill.active {
      background: var(--green-dim);
      color: var(--green);
      border-color: rgba(34,211,160,0.3);
    }
    .pill:hover:not(.active) { color: var(--text); border-color: rgba(255,255,255,0.12); }

    /* ── SUMMARY STATS ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
    }
    .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .stat-val { font-size: 20px; font-weight: 700; font-family: var(--mono); }
    .stat-val.green { color: var(--green); }
    .stat-val.amber { color: var(--amber); }
    .stat-val.blue  { color: var(--blue); }

    /* ── REPORT LIST ── */
    .list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .list-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .list-title { font-size: 13px; font-weight: 700; color: var(--text-sub); }

    .report-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .report-item:last-child { border-bottom: none; }
    .report-item:hover { background: rgba(255,255,255,0.02); }

    .rep-left { display: flex; align-items: center; gap: 12px; }
    .cat-icon {
      width: 36px; height: 36px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .rep-desc { font-size: 14px; font-weight: 600; }
    .rep-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .rep-amount { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--green); }

    .empty-state { padding: 48px 20px; text-align: center; color: var(--text-muted); }
    .empty-icon  { font-size: 40px; margin-bottom: 12px; }

    /* ── PREMIUM GATE ── */
    .premium-gate {
      background: linear-gradient(135deg, rgba(34,211,160,0.06), rgba(99,179,237,0.04));
      border: 1px solid rgba(34,211,160,0.15);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      margin-bottom: 20px;
    }
    .premium-gate .icon { font-size: 36px; margin-bottom: 12px; }
    .premium-gate h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .premium-gate p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="page-wrap">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="logo-sm">💸</div>
        <span class="app-name">Reports</span>
      </div>
      <div>
        <button class="btn btn-ghost btn-sm" onclick="window.location.href='expense.html'">← Dashboard</button>
      </div>
    </div>

    <!-- PREMIUM GATE (non-premium users) -->
    <div class="premium-gate" id="premiumGate" style="display:none;">
      <div class="icon">🌟</div>
      <h3>Premium Feature</h3>
      <p>Upgrade to Premium to access detailed reports and CSV downloads.</p>
      <button class="btn btn-primary" onclick="window.location.href='expense.html'">Go to Dashboard → Upgrade</button>
    </div>

    <!-- CONTROLS (premium users) -->
    <div class="control-bar" id="controls" style="display:none;">
      <div class="filter-group">
        <span class="filter-label">Filter:</span>
        <div class="filter-pills">
          <span class="pill active" data-val="all">All</span>
          <span class="pill" data-val="daily">Today</span>
          <span class="pill" data-val="weekly">Week</span>
          <span class="pill" data-val="monthly">Month</span>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" id="downloadBtn">⬇ Download JSON</button>
    </div>

    <!-- SUMMARY STATS (premium) -->
    <div class="summary-row" id="summaryRow" style="display:none;">
      <div class="stat-card">
        <div class="stat-label">Total</div>
        <div class="stat-val green" id="rStatTotal">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Count</div>
        <div class="stat-val amber" id="rStatCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Average</div>
        <div class="stat-val blue" id="rStatAvg">₹0</div>
      </div>
    </div>

    <!-- REPORT LIST -->
    <div class="list-card" id="listCard" style="display:none;">
      <div class="list-header">
        <span class="list-title">📋 Expense Records</span>
        <span class="badge badge-green" id="countBadge">0 items</span>
      </div>
      <div id="reportList"></div>
    </div>

  </div>

  <div id="toast"></div>
  <script src="report.js"></script>
</body>
</html>
